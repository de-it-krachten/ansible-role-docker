---
#
# Install Docker CE

- name: Show OS specifics
  ansible.builtin.debug:
    msg:
      - "ansible_facts.distribution: {{ ansible_facts.distribution }}"
      - "ansible_facts.distribution_major_version: {{ ansible_facts.distribution_major_version }}"
      - "ansible_facts.os_family: {{ ansible_facts.os_family }}"

- name: Load defaults based on OS type
  ansible.builtin.include_tasks: vars.yml

- name: Define OS specific task files  # noqa var-naming
  ansible.builtin.set_fact:
    "{{ item }}": "{{ lookup('first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_facts.distribution }}-{{ ansible_facts.distribution_major_version }}.yml"
        - "{{ ansible_facts.distribution }}.yml"
        - "family-{{ ansible_facts.os_family }}-{{ ansible_facts.distribution_major_version }}.yml"
        - "family-{{ ansible_facts.os_family }}.yml"
        - default.yml
      paths:
        - "tasks/{{ item | regex_replace('_', '-') }}"
  loop:
    - pre_install
    - install
    - config
    - post_config

- name: Pre-install phase
  ansible.builtin.include_tasks: "{{ pre_install }}"

- name: Setup LVM
  ansible.builtin.include_tasks: lvm.yml
  when: docker_lvm | bool

- name: Install phase
  ansible.builtin.include_tasks: "{{ install }}"

- name: Config phase
  ansible.builtin.include_tasks: "{{ config }}"

- name: Post-config phase
  ansible.builtin.include_tasks: "{{ post_config }}"
